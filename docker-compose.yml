services:
  samba-ad:
    build: .
    container_name: samba-ad-dc
    hostname: ${SAMBA_HOSTNAME:-dc1}
    privileged: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # DNS (mapped to 5300 to avoid macOS mDNSResponder conflict on 5353)
      - "5300:53/tcp"
      - "5300:53/udp"
      # Kerberos
      - "88:88/tcp"
      - "88:88/udp"
      # LDAP
      - "389:389/tcp"
      - "389:389/udp"
      # LDAPS
      - "636:636/tcp"
      # SMB
      - "445:445/tcp"
      # Kerberos kpasswd
      - "464:464/tcp"
      - "464:464/udp"
      # Global Catalog
      - "3268:3268/tcp"
      - "3269:3269/tcp"
    volumes:
      - samba-data:/var/lib/samba
      - samba-config:/etc/samba
    networks:
      - samba-net
    dns:
      - 127.0.0.1

volumes:
  samba-data:
  samba-config:

networks:
  samba-net:
    driver: bridge
